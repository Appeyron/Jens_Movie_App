<html>
<head>
    <title>Alea Movie App</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="page-header">
    <h1>Alea Movie App</h1>
    <p>Your personal movie collection</p>
</header>

<main>
    <ol class="movie-grid">
       
        <li>
            <div class="movie">
                <div class="poster-wrapper">
                    <a href="https://www.imdb.com/title/tt0120338/" target="_blank">
                        <img class="movie-poster"
                             src="https://m.media-amazon.com/images/M/MV5BYzYyN2FiZmUtYWYzMy00MzViLWJkZTMtOGY1ZjgzNWMwN2YxXkEyXkFqcGc@._V1_QL75_UX380_CR0,2,380,562_.jpg"
                             alt="Titanic"
                             title="my favourite"/>
                    </a>
                    <div class="movie-note">my favourite</div>
                </div>

                <div class="movie-title">Titanic</div>
                <div class="movie-year">1997</div>
                <div class="movie-rating">⭐ 8.0</div>

                <div class="movie-country">
                    <img class="movie-flag" src="https://flagcdn.com/w40/us.png" alt="United States, Mexico flag">
                    <span>United States, Mexico</span>
                </div>

            </div>
        </li>
        
    </ol>
</main>
</body>
</html>
